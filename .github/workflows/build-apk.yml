name: Build DistAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🔑 关键新增：手动克隆 llama.cpp 源码到指定目录
      - name: Manually clone llama.cpp
        run: |
          mkdir -p native
          # 克隆官方仓库到 native/llama.cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git native/llama.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          # 软链接防止脚本去找旧版本的 NDK
          ln -s $ANDROID_HOME/ndk/27.0.12077973 $ANDROID_HOME/ndk/29.0.14033894

      - name: Grant execute permission for gradlew & build script
        run: |
          chmod +x gradlew
          if [ -f native/build-android.sh ]; then chmod +x native/build-android.sh; fi

      - name: Build ARM native binaries
        run: |
          if [ -f native/build-android.sh ]; then ./native/build-android.sh; fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: distai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
